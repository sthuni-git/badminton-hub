name: 24/7 Automated Badminton Tournament Scraper

on:
  # 이전 버전 스케줄러: 신규 scrape-tournaments.yml(AI 통합 파이프라인)으로 일원화됨
  # schedule:
  #   - cron: '0 19 * * *'
  #   - cron: '0 7 * * *'
  
  # 수동 실행 전용으로 보존
  workflow_dispatch:

# 저장소 쓰기 권한 부여 (자동 커밋 및 푸시용)
permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드를 가져옵니다 (Checkout)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 2. Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. 의존성 패키지 설치
        run: npm ci

      - name: 4. 10대 플랫폼 전국 대회 전수 스크랩 & 데이터 무결성 검증
        run: npm run scrape

      - name: 5. 정적 빌드 및 SSG 생성 사전 검증
        run: npm run build

      - name: 6. 갱신된 데이터 자동 커밋 & 푸시 (Vercel 자동 배포 연동)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add lib/tournaments-scraped.json
          
          # 변경사항이 있을 때만 커밋 & 푸시
          if git diff --staged --quiet; then
            echo "대회 데이터 변경사항이 없습니다."
          else
            git commit -m "chore(data): 9대 플랫폼 실시간 전국 배드민턴 대회 자동 갱신"
            git pull --rebase origin main
            git push origin main
            echo "새로운 대회가 성공적으로 커밋되었으며 Vercel 자동 배포가 시작됩니다!"
          fi
